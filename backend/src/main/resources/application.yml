server:
  port: 8080

spring:
  application:
    name: math-buddy
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  # 本地私有配置（application-local.yml 已在 .gitignore 中排除，不会提交）
  config:
    import:
      - optional:file:./application-local.yml
      - optional:classpath:application-local.yml

# 通义千问配置（DashScope 的 OpenAI 兼容模式）
# 部署上线时推荐二选一：
# 1. 直接设置环境变量 QWEN_API_KEY（明文，适合简单部署）
# 2. 把 API Key 用 ApiKeyCipher 加密后填到下面 qwen.api-key，部署时设置 QWEN_API_KEY_MASTER 解密主密钥
qwen:
  # 以 ENC: 开头表示加密存储，否则按明文使用。
  # 示例：api-key: ENC:xxxxx（先用 backend/src/main/java/com/example/mathbuddy/config/ApiKeyCipher.java 加密）
  api-key: ${QWEN_API_KEY:}
  # 解密主密钥，仅在 api-key 以 ENC: 开头时需要
  api-key-master: ${QWEN_API_KEY_MASTER:}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  # 识图（多模态）用的模型
  vl-model: qwen3-vl-plus

logging:
  level:
    com.example.mathbuddy: info
